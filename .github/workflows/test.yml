name: Tests
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [18, 20, 22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: npm ci
      - run: npm test
      # La prueba de interfaz usa jsdom 31, que pide Node 22 o más nuevo.
      - run: npm run test:ui
        if: ${{ matrix.node >= 22 }}
